name: Build Asisten Klik V4

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Extract ZIP & Build APK
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # CHECKOUT
      # ==============================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==============================
      # JAVA
      # ==============================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==============================
      # ANDROID SDK
      # ==============================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ==============================
      # FIND ZIP
      # ==============================
      - name: Find V4 ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "MENCARI ZIP V4"
          echo "======================================"

          ZIP_FILE=""

          for f in *.zip; do
            if [ -f "$f" ]; then
              ZIP_FILE="$f"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . \
              -maxdepth 3 \
              -type f \
              -iname "*.zip" \
              ! -path "./.git/*" \
              | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP tidak ditemukan."

            echo ""
            echo "Isi repository:"
            find . -maxdepth 4 -type f | sort

            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==============================
      # EXTRACT ZIP
      # ==============================
      - name: Extract V4 ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q -o "$ZIP_FILE" -d extracted

          echo ""
          echo "======================================"
          echo "HASIL EXTRACT"
          echo "======================================"

          find extracted -maxdepth 6 -type f | sort


      # ==============================
      # LOCATE ANDROID PROJECT
      # ==============================
      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          PROJECT=""

          echo "======================================"
          echo "MENCARI ANDROID PROJECT"
          echo "======================================"

          # Cari settings.gradle
          while IFS= read -r file; do
            PROJECT="$(dirname "$file")"
            break
          done < <(
            find extracted \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              | sort
          )

          # Fallback cari app/build.gradle
          if [ -z "$PROJECT" ]; then

            APP_BUILD=$(find extracted \
              -type f \
              \( \
                -path "*/app/build.gradle" \
                -o \
                -path "*/app/build.gradle.kts" \
              \) \
              | head -n 1 || true)

            if [ -n "$APP_BUILD" ]; then
              PROJECT="$(dirname "$(dirname "$APP_BUILD")")"
            fi

          fi

          if [ -z "$PROJECT" ]; then
            echo ""
            echo "ERROR: Android project tidak ditemukan."

            echo ""
            echo "Struktur ZIP:"
            find extracted -maxdepth 10 -print | sort

            exit 1
          fi

          PROJECT="$(realpath "$PROJECT")"

          echo ""
          echo "PROJECT:"
          echo "$PROJECT"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"


      # ==============================
      # COPY PROJECT
      # ==============================
      - name: Prepare Build Directory
        shell: bash
        run: |
          set -e

          rm -rf android_project
          mkdir -p android_project

          cp -a "$PROJECT"/. android_project/

          echo "======================================"
          echo "ANDROID PROJECT"
          echo "======================================"

          find android_project -maxdepth 6 -type f | sort


      # ==============================
      # VERIFY
      # ==============================
      - name: Verify Android Project
        shell: bash
        run: |
          set -e

          test -f android_project/settings.gradle \
            || test -f android_project/settings.gradle.kts

          test -d android_project/app

          test -f android_project/app/build.gradle \
            || test -f android_project/app/build.gradle.kts

          test -f android_project/app/src/main/AndroidManifest.xml

          echo ""
          echo "ANDROID PROJECT OK"


      # ==============================
      # GRADLE
      # ==============================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      # ==============================
      # GRADLE WRAPPER
      # ==============================
      - name: Prepare Gradle Wrapper
        shell: bash
        working-directory: android_project
        run: |
          set -e

          if [ -f "./gradlew" ]; then

            echo "Gradle wrapper ditemukan."

            chmod +x ./gradlew

          else

            echo "Gradle wrapper tidak ditemukan."
            echo "Membuat wrapper..."

            gradle wrapper --gradle-version 8.10.2

            chmod +x ./gradlew

          fi

          ./gradlew --version


      # ==============================
      # BUILD
      # ==============================
      - name: Build Debug APK
        shell: bash
        working-directory: android_project
        run: |
          set -e

          echo "======================================"
          echo "BUILD APK"
          echo "======================================"

          ./gradlew \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain


      # ==============================
      # FIND APK
      # ==============================
      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find android_project \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: APK tidak ditemukan."

            echo ""
            find android_project \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo ""
          echo "APK ditemukan:"
          echo "$APK"

          mkdir -p output

          cp "$APK" output/AsistenKlik-V4.apk

          ls -lh output/AsistenKlik-V4.apk


      # ==============================
      # UPLOAD APK
      # ==============================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AsistenKlik-V4
          path: output/AsistenKlik-V4.apk
          if-no-files-found: error
          retention-days: 14


      # ==============================
      # SUCCESS
      # ==============================
      - name: Success
        run: |
          echo ""
          echo "======================================"
          echo "BUILD BERHASIL"
          echo "======================================"
          echo ""
          echo "Artifact:"
          echo "AsistenKlik-V4"
